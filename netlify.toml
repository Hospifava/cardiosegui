# Configuración de Netlify para CardioSegui (se usa si se publica conectando el repositorio).
# Solo se publica la carpeta "public" (index.html + logo).
# Los demás archivos de esta carpeta (scripts, notas) NO se suben al sitio.
#
# Los encabezados de seguridad están en public/_headers, para que funcionen
# también al subir solo la carpeta "public" con Netlify Drop.

[build]
  publish = "public"
